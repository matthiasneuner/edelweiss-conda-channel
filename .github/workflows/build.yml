name: build

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload built packages to prefix.dev"
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - ".github/workflows/publish.yml"
  pull_request:
    paths-ignore:
      - "README.md"
      - ".github/workflows/publish.yml"

env:
  # conda-forge/vtk-feedstock commit the vtk packages are built from; bump deliberately.
  VTK_FEEDSTOCK_REV: 771d76e
  CHANNEL: matthiasneuner/edelweiss

jobs:
  build:
    name: ${{ matrix.subdir }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { subdir: linux-64, os: ubuntu-24.04, ci_support: linux_64 }
          - { subdir: osx-arm64, os: macos-15, ci_support: osx_arm64 }
          - { subdir: osx-64, os: macos-15-intel, ci_support: osx_64 }
          - { subdir: win-64, os: windows-2022, ci_support: win_64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    permissions:
      contents: read
      id-token: write  # trusted publishing to prefix.dev
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.9.1
        with:
          run-install: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install tools
        run: |
          pixi global install rattler-build
          python -m pip install pyyaml

      - name: Build header-only packages
        run: |
          for recipe in fastor autodiff amgcl; do
            rattler-build build --recipe recipes/$recipe -c conda-forge --output-dir output
          done

      - name: Fetch vtk-feedstock
        run: |
          git clone https://github.com/conda-forge/vtk-feedstock.git
          git -C vtk-feedstock checkout "$VTK_FEEDSTOCK_REV"

      - name: Derive cp314t variant
        run: |
          python scripts/make_cp314t_variant.py \
            vtk-feedstock/.ci_support/${{ matrix.ci_support }}_python3.14.____cp314.yaml variant_cp314t.yaml
          cat variant_cp314t.yaml

      - name: Build vtk (cp314t)
        run: |
          rattler-build build --recipe vtk-feedstock/recipe -m variant_cp314t.yaml -c conda-forge \
            --output-dir output --log-style plain

      # A package that links a library from outside its conda environment works on the build machine
      # and nowhere else: vtk-base once linked a system libhdf5.so.320 while declaring hdf5 1.14.6.
      # Install the fresh build into a clean environment and require every shared-library dependency
      # to resolve inside it (or to the OS itself), then exercise the Exodus/HDF5 reader EdelweissFE uses.
      - name: Check linkage in a clean environment
        run: |
          pixi global install rattler-index
          rattler-index fs output
          pixi init --channel "file://$PWD/output" --channel conda-forge --platform ${{ matrix.subdir }} check-env
          cd check-env
          pixi add "python-freethreading=3.14" vtk
          pixi run python -c "import sys, vtk; from vtkmodules.vtkIOIOSS import vtkIOSSReader; from vtkmodules.vtkIOExodus import vtkExodusIIReader; from vtkmodules.vtkIOHDF import vtkHDFReader; print(sys.version, 'vtk', vtk.vtkVersion.GetVTKVersion()); assert not sys._is_gil_enabled()"
          prefix=$(pixi run python -c "import sys; print(sys.prefix)")
          case "${{ matrix.subdir }}" in
            linux-*)
              bad=$(find "$prefix/lib" -name 'libvtk*.so*' -type f -exec ldd {} \; | grep -E 'not found|=> /(usr/)?lib' \
                | grep -vE 'lib(c|m|dl|rt|pthread|resolv|util|gcc_s|stdc\+\+|GL|GLX|OpenGL|EGL|X11|xcb|Xau|Xdmcp)\.so' | sed -E 's/ \(0x[0-9a-f]+\)//' | sort -u || true) ;;
            osx-*)
              bad=$(find "$prefix/lib" -name 'libvtk*.dylib' -type f -exec otool -L {} \; | grep -E '^\s+/' \
                | grep -vE '^\s+(/usr/lib/|/System/Library/)' | sed -E 's/ \(0x[0-9a-f]+\)//' | sort -u || true) ;;
            *)
              bad="" ;;  # win-64: covered by the import test above (Windows does not fall back to system copies)
          esac
          if [ -n "$bad" ]; then echo "::error::vtk links libraries from outside the environment:"; echo "$bad"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.subdir }}
          path: |
            output/${{ matrix.subdir }}/*.conda
            output/noarch/*.conda

      - name: Upload to prefix.dev
        if: github.event_name == 'workflow_dispatch' && inputs.upload
        env:
          PREFIX_API_KEY: ${{ secrets.PREFIX_API_KEY }}
        run: |
          rattler-build upload prefix --skip-existing --channel "$CHANNEL" output/${{ matrix.subdir }}/*.conda
