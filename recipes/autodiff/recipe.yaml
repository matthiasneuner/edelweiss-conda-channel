context:
  version: "1.1.2"
package:
  name: autodiff
  version: ${{ version }}
source:
  git: https://github.com/autodiff/autodiff.git
  tag: v${{ version }}
  patches:
    # Eigen 5 support, upstream autodiff PR #397 (open as of 2026-09-27); drop once released.
    - eigen5-singlerange-pr397.patch
build:
  number: 3
  # Header-only, but not noarch: conda puts headers in include/ on Unix and Library/include on
  # Windows, so each platform needs its own package.
  # _cmake_build, not build: autodiff ships a Bazel BUILD file, which collides with build/ on the
  # case-insensitive macOS and Windows filesystems.
  script:
    - if: win
      then:
        - cmake -S . -B _cmake_build -G Ninja -DAUTODIFF_BUILD_TESTS=OFF -DAUTODIFF_BUILD_PYTHON=OFF -DAUTODIFF_BUILD_EXAMPLES=OFF -DAUTODIFF_BUILD_DOCS=OFF -DCMAKE_INSTALL_PREFIX=%LIBRARY_PREFIX% -DCMAKE_PREFIX_PATH=%LIBRARY_PREFIX%
        - cmake --install _cmake_build
      else:
        - cmake -S . -B _cmake_build -G Ninja -DAUTODIFF_BUILD_TESTS=OFF -DAUTODIFF_BUILD_PYTHON=OFF -DAUTODIFF_BUILD_EXAMPLES=OFF -DAUTODIFF_BUILD_DOCS=OFF -DCMAKE_INSTALL_PREFIX=$PREFIX -DCMAKE_PREFIX_PATH=$PREFIX
        - cmake --install _cmake_build
requirements:
  build:
    - cmake
    - ninja
    - ${{ compiler('cxx') }}
  host:
    - eigen
  run:
    - eigen
  ignore_run_exports:
    # Header-only: the compiler is only needed for CMake's configure step, so its runtime
    # libraries must not become (pinned) dependencies of the package.
    by_name:
      - libstdcxx
      - libgcc
      - libcxx
      - vc14_runtime
      - vc
      - ucrt
tests:
  - package_contents:
      include:
        - autodiff/forward/dual.hpp
about:
  homepage: https://autodiff.github.io
  license: MIT
  license_file: LICENSE
  summary: Automatic differentiation made easier for C++
