context:
  version: "1.4.7"
package:
  name: amgcl
  version: ${{ version }}
source:
  git: https://github.com/ddemidov/amgcl.git
  tag: ${{ version }}
build:
  number: 2
  # Header-only: do not pin users to the Boost version this package happened to be built against
  # (libboost-devel's run_exports would), or it conflicts with packages pinning another Boost (vtk).
  # Header-only, but not noarch: conda puts headers in include/ on Unix and Library/include on
  # Windows, so each platform needs its own package.
  # _cmake_build, not build: autodiff ships a Bazel BUILD file, which collides with build/ on the
  # case-insensitive macOS and Windows filesystems.
  script:
    - if: win
      then:
        - cmake -S . -B _cmake_build -G Ninja -DCMAKE_INSTALL_PREFIX=%LIBRARY_PREFIX% -DCMAKE_PREFIX_PATH=%LIBRARY_PREFIX%
        - cmake --install _cmake_build
      else:
        - cmake -S . -B _cmake_build -G Ninja -DCMAKE_INSTALL_PREFIX=$PREFIX -DCMAKE_PREFIX_PATH=$PREFIX
        - cmake --install _cmake_build
requirements:
  build:
    - cmake
    - ninja
    - ${{ compiler('cxx') }}
  host:
    - libboost-devel
  run:
    - libboost-devel
  ignore_run_exports:
    from_package:
      - libboost-devel
    # Header-only: the compiler is only needed for CMake's configure step, so its runtime
    # libraries must not become (pinned) dependencies of the package.
    by_name:
      - libstdcxx
      - libgcc
      - libcxx
      - vc14_runtime
      - vc
      - ucrt
tests:
  - package_contents:
      include:
        - amgcl/amg.hpp
about:
  homepage: https://github.com/ddemidov/amgcl
  license: MIT
  license_file: LICENSE.md
  summary: Header-only C++ library for solving large sparse linear systems with algebraic multigrid
