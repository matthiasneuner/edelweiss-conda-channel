context:
  version: "0.6.4.post6"
  rev: a3002342a2c4fd78b80ca69214bd021d1c73d5a7
package:
  name: fastor
  version: ${{ version }}
source:
  git: https://github.com/romeric/Fastor.git
  rev: ${{ rev }}
  patches:
    # Apple Silicon (arm64) build fix from BOKU-CMP-MEC-MAT/Fastor@5a3d6920 (branch arm64/apple-silicon-master),
    # README changes dropped. Guards x86-only cpuid asm and fixes the scalar-ABI path arm64 uses.
    - apple-silicon-boku-5a3d6920.patch
build:
  number: 3
  # Header-only, but not noarch: conda puts headers in include/ on Unix and Library/include on
  # Windows, so each platform needs its own package.
  # _cmake_build, not build: autodiff ships a Bazel BUILD file, which collides with build/ on the
  # case-insensitive macOS and Windows filesystems.
  script:
    - if: win
      then:
        - cmake -S . -B _cmake_build -G Ninja -DBUILD_TESTING=OFF -DCMAKE_INSTALL_PREFIX=%LIBRARY_PREFIX% -DCMAKE_PREFIX_PATH=%LIBRARY_PREFIX%
        - cmake --install _cmake_build
      else:
        - cmake -S . -B _cmake_build -G Ninja -DBUILD_TESTING=OFF -DCMAKE_INSTALL_PREFIX=$PREFIX -DCMAKE_PREFIX_PATH=$PREFIX
        - cmake --install _cmake_build
requirements:
  build:
    - cmake
    - ninja
    - ${{ compiler('cxx') }}
  ignore_run_exports:
    # Header-only: the compiler is only needed for CMake's configure step, so its runtime
    # libraries must not become (pinned) dependencies of the package.
    by_name:
      - libstdcxx
      - libgcc
      - libcxx
      - vc14_runtime
      - vc
      - ucrt
tests:
  - package_contents:
      include:
        - Fastor/Fastor.h
about:
  homepage: https://github.com/romeric/Fastor
  license: MIT
  license_file: LICENSE
  summary: Header-only SIMD tensor algebra library (C++)
